<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar conta</title><link rel="stylesheet" href="estilo.css"></head>
<body>
<h1>Criar conta</h1><p><a href="index.html">← início</a></p>
<form id="f">
 <label>Usuário (4–23: letras, números, _)<input name="usuario" required minlength="4" maxlength="23" pattern="[A-Za-z0-9_]+" autocomplete="username"></label>
 <label>Senha (4–23, sem acentos)<input name="senha" type="password" required minlength="4" maxlength="23" autocomplete="new-password"></label>
 <label>Repita a senha<input name="senha2" type="password" required autocomplete="new-password"></label>
 <label>E-mail<input name="email" type="email" required maxlength="39" autocomplete="email"></label>
 <label>Sexo<select name="sexo"><option value="M">Masculino</option><option value="F">Feminino</option></select></label>
 <button>Criar conta</button>
</form>
<div id="msg"></div>
<script src="config.js"></script><script src="cadastro.js"></script>
</body></html>
